<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DreamByte OS TV</title>
<style>
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-family:system-ui,sans-serif;color:#eaf3ff;
    background:radial-gradient(1000px 500px at 70% -10%,#12307a 0%,transparent 60%),linear-gradient(180deg,#0a1a4a,#050b24)}
  h1{font-size:3rem;margin:0 0 .25em;text-shadow:0 0 24px #2f7bff}
  p{color:#a9c2ea;margin:.2em 0 1.6em}
  .grid{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;max-width:900px}
  a{display:block;min-width:220px;padding:22px 28px;border-radius:18px;text-decoration:none;color:#eaf3ff;font-size:1.4rem;
    background:rgba(30,70,160,.25);border:1px solid rgba(90,160,255,.45)}
  a:focus,a:hover{outline:3px solid #7fd0ff;box-shadow:0 0 22px #2f7bff}
  small{display:block;color:#a9c2ea;font-size:.85rem;margin-top:4px}
  footer{margin-top:2.5em;color:#a9c2ea;font-size:.9rem}
</style>
</head>
<body>
  <h1>DreamByte OS TV</h1>
  <p>Versión 0.1 Experimental · DreamByte Studios</p>
  <div class="grid">
    <a href="https://duckduckgo.com">Buscar en la web<small>Navegador</small></a>
    <a href="https://www.youtube.com">YouTube<small>Beta · sin validar</small></a>
    <a href="https://www.netflix.com">Netflix<small>Sin garantía (DRM no validado)</small></a>
  </div>
  <footer>Usa Tab y las flechas para moverte. Ctrl+L escribe una dirección.</footer>
</body>
</html>
